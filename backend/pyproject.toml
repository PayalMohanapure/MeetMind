[project]
name = "meetmind-backend"
version = "1.0.0"
description = "MeetMind backend: FastAPI, PostgreSQL + pgvector, JWT, WebRTC signaling, RAG and an AI agent"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends()/File() in defaults is intended

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

